# Publishes the package to pub.dev when a version tag (e.g. v1.0.3) is pushed.
#
# One-time setup on pub.dev: Package page -> Admin -> Automated publishing ->
# enable "Publishing from GitHub Actions", repository
# `sreeragbap/pjsip_connect_flutter`, tag pattern `v{{version}}`.
#
# Release: bump `version:` in pubspec.yaml, update CHANGELOG.md, then
#   git tag v<version> && git push origin v<version>
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # Required for pub.dev OIDC authentication.
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Sets up the OIDC token that `pub publish` uses to authenticate.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check tag matches pubspec version
        run: |
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PUBSPEC_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $PUBSPEC_VERSION"
            exit 1
          fi

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze
        run: flutter analyze lib

      # Newer Flutter SDKs may rewrite tracked files (e.g. analysis_options.yaml)
      # during pub get / analyze, which makes `pub publish` refuse a dirty tree.
      # Publish exactly what is committed, and record what was changed.
      - name: Revert files modified by tooling
        run: |
          if ! git diff --quiet; then
            DIFF=$(git diff | tr -d '\r' | sed 's/%/%25/g' | awk 1 ORS='%0A')
            echo "::warning title=Reverted files modified by Flutter tooling::${DIFF}"
            git checkout -- .
          fi

      - name: Dry run
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/dry_run.log"
          if ! flutter pub publish --dry-run 2>&1 | tee "$LOG"; then
            # Surface the validation result as an annotation on the run summary.
            MSG=$(tail -n 60 "$LOG" | tr -d '\r' | sed 's/%/%25/g' | awk 1 ORS='%0A')
            echo "::error title=pub publish dry-run failed::${MSG}"
            exit 1
          fi

      - name: Publish
        run: flutter pub publish --force
